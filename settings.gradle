rootProject.name = 'taskcomm'

// Сборка обязана идти на JDK 25.0.4 или новее (docs/adr/0088-java-25-spring-boot-4.md). Проверяется
// JVM самого Gradle daemon, а не только toolchain: palantir-java-format надёжно форматирует
// конструкции новых версий Java, только когда daemon запущен на той же версии (CLAUDE.md,
// «Каталог версий»). Toolchain умеет требовать лишь мажорную версию, поэтому нижняя граница
// патча проверяется здесь.
def minimumJdk = Runtime.Version.parse('25.0.4')
if (Runtime.version() < minimumJdk) {
    throw new GradleException(
            "Сборка taskcomm требует JDK ${minimumJdk} или новее, а Gradle запущен на ${Runtime.version()}. "
                    + 'Укажите JAVA_HOME на подходящий JDK.')
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        // Дистрибутивы Node для сборки фронтенда taskcomm-ui. Объявлены здесь, а не плагином в модуле:
        // репозиторий модуля отменил бы для него все репозитории отсюда.
        ivy {
            name = 'Node.js'
            url = 'https://nodejs.org/dist/'
            patternLayout {
                artifact 'v[revision]/[artifact](-v[revision]-[classifier]).[ext]'
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule('org.nodejs', 'node')
            }
        }
    }

    // Version catalog. Версии фиксируются здесь явно — см. CLAUDE.md, раздел «Каталог версий».
    // Версия самого Gradle сюда не входит: она живёт в gradle/wrapper/gradle-wrapper.properties.
    versionCatalogs {
        libs {
            // Приходят из BOM Spring Boot ниже, но версия самого Boot фиксируется явно.
            version('spring-boot', '4.1.1')
            version('mapstruct', '1.6.3')
            version('lombok', '1.18.48')
            version('lombok-mapstruct-binding', '0.2.0')
            version('jetbrains-annotations', '24.1.0')

            // Инструменты сборки и контроля качества кода.
            version('checkstyle', '14.0.0')
            version('spotless-plugin', '8.10.0')
            version('palantir-java-format', '2.97.0')
            version('errorprone-plugin', '5.1.0')
            version('errorprone-core', '2.50.0')
            version('archunit', '1.5.0')

            library('spring-boot-bom', 'org.springframework.boot', 'spring-boot-dependencies').versionRef('spring-boot')
            library('spring-boot-autoconfigure', 'org.springframework.boot', 'spring-boot-autoconfigure').versionRef('spring-boot')
            library('spring-boot-starter', 'org.springframework.boot', 'spring-boot-starter').versionRef('spring-boot')
            library('spring-boot-starter-jdbc', 'org.springframework.boot', 'spring-boot-starter-jdbc').versionRef('spring-boot')
            library('spring-boot-jdbc', 'org.springframework.boot', 'spring-boot-jdbc').versionRef('spring-boot')
            // Jackson 3 для нагрузки и результатов (docs/adr/0092): потребителю приезжает стартером Boot,
            // код стартера видит только databind, версия — из BOM.
            library('spring-boot-starter-jackson', 'org.springframework.boot', 'spring-boot-starter-jackson').versionRef('spring-boot')
            library('jackson-databind', 'tools.jackson.core', 'jackson-databind').withoutVersion()
            // XML для разбора SOAP по умолчанию (docs/adr/0135): стартер её не тянет, SOAP-потребитель
            // подключает сам; версия — из BOM.
            library('jackson-dataformat-xml', 'tools.jackson.dataformat', 'jackson-dataformat-xml').withoutVersion()
            // REST (docs/adr/0140): потребителю не приезжают — REST включает он сам, у него MVC и Security свои;
            // версии — из BOM.
            library('spring-webmvc', 'org.springframework', 'spring-webmvc').withoutVersion()
            library('spring-security-web', 'org.springframework.security', 'spring-security-web').withoutVersion()
            // Контроллер статики taskcomm-ui (docs/adr/0149): только для компиляции, servlet API — у потребителя.
            library('jakarta-servlet-api', 'jakarta.servlet', 'jakarta.servlet-api').withoutVersion()
            // Наблюдаемость (docs/adr/0141): метрики и health — только у тех, у кого Micrometer и Actuator свои.
            library('micrometer-core', 'io.micrometer', 'micrometer-core').withoutVersion()
            library('spring-boot-health', 'org.springframework.boot', 'spring-boot-health').withoutVersion()
            library('spring-boot-starter-webmvc', 'org.springframework.boot', 'spring-boot-starter-webmvc').versionRef('spring-boot')
            library('spring-boot-starter-test', 'org.springframework.boot', 'spring-boot-starter-test').versionRef('spring-boot')
            library('spring-boot-configuration-processor', 'org.springframework.boot', 'spring-boot-configuration-processor').versionRef('spring-boot')
            library('spring-boot-autoconfigure-processor', 'org.springframework.boot', 'spring-boot-autoconfigure-processor').versionRef('spring-boot')

            library('lombok', 'org.projectlombok', 'lombok').versionRef('lombok')
            library('lombok-mapstruct-binding', 'org.projectlombok', 'lombok-mapstruct-binding').versionRef('lombok-mapstruct-binding')
            library('mapstruct', 'org.mapstruct', 'mapstruct').versionRef('mapstruct')
            library('mapstruct-processor', 'org.mapstruct', 'mapstruct-processor').versionRef('mapstruct')
            library('jetbrains-annotations', 'org.jetbrains', 'annotations').versionRef('jetbrains-annotations')
            // Версия из BOM Spring Boot; потребителю SLF4J приезжает со spring-boot-starter.
            library('slf4j-api', 'org.slf4j', 'slf4j-api').withoutVersion()

            library('archunit-junit5', 'com.tngtech.archunit', 'archunit-junit5').versionRef('archunit')

            // Только для тестов, версии — из BOM Spring Boot (docs/adr/0085, docs/adr/0092): драйвер
            // PostgreSQL потребителю не приезжает, Liquibase у стартера нет вовсе.
            library('postgresql', 'org.postgresql', 'postgresql').withoutVersion()
            library('testcontainers-postgresql', 'org.testcontainers', 'testcontainers-postgresql').withoutVersion()
            library('testcontainers-junit-jupiter', 'org.testcontainers', 'testcontainers-junit-jupiter').withoutVersion()
            library('liquibase-core', 'org.liquibase', 'liquibase-core').withoutVersion()
            // Последняя версия Liquibase под Apache 2.0 — только для теста совместимости changelog
            // с веткой 4 (docs/adr/0092); в classpath тестов не попадает, грузится отдельным загрузчиком.
            version('liquibase4', '4.33.0')
            library('liquibase4-core', 'org.liquibase', 'liquibase-core').versionRef('liquibase4')
            // Необязательная зависимость liquibase-core, без которой не стартует его командная строка.
            library('liquibase4-picocli', 'info.picocli', 'picocli').version('4.7.7')
            library('errorprone-core', 'com.google.errorprone', 'error_prone_core').versionRef('errorprone-core')

            plugin('spotless', 'com.diffplug.spotless').versionRef('spotless-plugin')
            plugin('errorprone', 'net.ltgt.errorprone').versionRef('errorprone-plugin')
            // Сборка фронтенда taskcomm-ui (docs/adr/0149-web-interface-module.md): плагин сам скачивает Node,
            // ставить его на машину и в CI не нужно. Версия Node — в taskcomm-ui/build.gradle.
            version('node-plugin', '7.1.0')
            plugin('node', 'com.github.node-gradle.node').versionRef('node-plugin')
        }
    }
}

include 'taskcomm-autoconfigure'
include 'taskcomm-spring-boot-starter'
include 'taskcomm-bom'
include 'taskcomm-ui'
