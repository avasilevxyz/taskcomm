// Корневой проект не содержит кода — только общие настройки модулей
// (docs/adr/0001-module-layout.md). Библиотечные модули — java-library: у стартера просто
// не будет исходников. taskcomm-bom — java-platform (docs/adr/0144-taskcomm-bom.md), эти два
// плагина несовместимы, поэтому общие настройки ниже его не касаются: сборка и проверки BOM —
// в его собственном build.gradle.
allprojects {
    group = 'xyz.avasilev'
    version = '2.0.2'

    // Публикация — из GitHub Actions по тегу v<версия> в два места: GitHub Packages
    // (docs/adr/0146-publishing-to-github-packages.md) и Maven Central
    // (docs/adr/0147-publishing-to-maven-central.md). Учётные данные и ключ подписи — только
    // из окружения, в файлы репозитория они не попадают. Без них publishToMavenLocal работает
    // как раньше: подпись пропускается, падает только публикация в GitHub Packages.
    plugins.withId('maven-publish') {
        apply plugin: 'signing'

        publishing {
            repositories {
                maven {
                    name = 'GitHubPackages'
                    url = 'https://maven.pkg.github.com/avasilevxyz/taskcomm'
                    credentials {
                        username = providers.environmentVariable('GITHUB_ACTOR').orNull
                        password = providers.environmentVariable('GITHUB_TOKEN').orNull
                    }
                }
                // Каталог, из которого задача centralBundle собирает архив для Central Portal:
                // file-репозиторий сам кладёт контрольные суммы, подписи кладёт плагин signing.
                maven {
                    name = 'CentralStaging'
                    url = rootProject.layout.buildDirectory.dir('central/staging')
                }
            }
            publications.withType(MavenPublication).configureEach {
                pom {
                    name = project.name
                    description = [
                            'taskcomm-autoconfigure'      : 'Код и автоконфигурации taskcomm: задачи, коммуникации с внешними системами, REST',
                            'taskcomm-spring-boot-starter': 'Spring Boot стартер taskcomm: таск-менеджмент и коммуникации с внешними системами на PostgreSQL',
                            'taskcomm-bom'                : 'Версии taskcomm и согласованных с ним зависимостей',
                    ][project.name]
                    url = 'https://github.com/avasilevxyz/taskcomm'
                    developers {
                        developer {
                            id = 'avasilevxyz'
                            name = 'Anton Vasilev'
                            url = 'https://github.com/avasilevxyz'
                        }
                    }
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    scm {
                        url = 'https://github.com/avasilevxyz/taskcomm'
                        connection = 'scm:git:https://github.com/avasilevxyz/taskcomm.git'
                        developerConnection = 'scm:git:ssh://git@github.com/avasilevxyz/taskcomm.git'
                    }
                }
            }
        }

        // Central принимает только подписанные артефакты. Ключ — ASCII-armored закрытый ключ
        // в SIGNING_KEY, пароль — в SIGNING_PASSWORD. Нет ключа — подпись не обязательна
        // и пропускается: так работают локальная сборка и publishToMavenLocal.
        def signingKey = providers.environmentVariable('SIGNING_KEY')
        signing {
            required = signingKey.present
            if (signingKey.present) {
                useInMemoryPgpKeys(signingKey.get(), providers.environmentVariable('SIGNING_PASSWORD').orNull)
            }
            sign publishing.publications
        }

        // Каталог очищается перед публикацией в него: в архив не должны попасть файлы прошлых сборок.
        tasks.withType(PublishToMavenRepository).configureEach {
            if (name.endsWith('ToCentralStagingRepository')) {
                dependsOn rootProject.tasks.named('cleanCentralStaging')
            }
        }
    }
}

// Архив выпуска для Central Portal (docs/adr/0147-publishing-to-maven-central.md): все модули,
// опубликованные в каталог CentralStaging, с подписями и контрольными суммами. Отправляет его
// workflow publish.yml; здесь — только сборка и проверка, что подписано всё.
def centralStaging = layout.buildDirectory.dir('central/staging')

tasks.register('cleanCentralStaging', Delete) {
    delete centralStaging
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Собирает подписанный архив выпуска для Maven Central.'
    dependsOn subprojects.collect { "${it.path}:publishAllPublicationsToCentralStagingRepository" }
    from centralStaging
    exclude '**/maven-metadata*'
    destinationDirectory = layout.buildDirectory.dir('central')
    archiveFileName = 'central-bundle.zip'
    doFirst {
        def unsigned = fileTree(centralStaging) {
            include '**/*.jar', '**/*.pom', '**/*.module'
        }.files.findAll { !new File(it.path + '.asc').exists() }
        if (!unsigned.isEmpty()) {
            throw new GradleException(
                    'Central не примет неподписанные файлы — задайте SIGNING_KEY и SIGNING_PASSWORD: '
                            + unsigned*.name.join(', '))
        }
    }
}

configure(subprojects.findAll { it.name != 'taskcomm-bom' }) {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        // Java 25 — фиксированное решение проекта (docs/adr/0088), а не значение из каталога версий:
        // обращение к version catalog из subprojects{} в корневом build.gradle помечено
        // deprecated в Gradle 9 (implicit lookup in parent projects, уйдёт в Gradle 10).
        // Нижняя граница патча (25.0.4) проверяется в settings.gradle.
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        // Исходники и Javadoc рядом с jar: IDE потребителя показывает документацию публичного API.
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    // Все модули публикуются под одной и той же version/group; репозиторий — в allprojects выше.
    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }

    // Опубликованные метаданные библиотечных модулей не должны тянуть потребителю ничью платформу
    // (docs/adr/0106-starter-does-not-export-bom.md; собственный BOM подключается потребителем
    // сознательно и проверяется своей задачей — docs/adr/0144-taskcomm-bom.md): BOM в Gradle Module Metadata поднимает
    // все его зависимости у Gradle-потребителя, а импорт в dependencyManagement POM — признак
    // того же. Проверка читает сгенерированные файлы, а не build.gradle: платформа может прийти
    // и не из явной строки.
    def verifyNoExportedPlatform = tasks.register('verifyNoExportedPlatform') {
        group = 'verification'
        description = 'Проверяет, что опубликованные .module и .pom не экспортируют платформу (BOM).'
        def moduleTask = tasks.named('generateMetadataFileForMavenPublication')
        def pomTask = tasks.named('generatePomFileForMavenPublication')
        dependsOn moduleTask, pomTask
        def moduleFile = moduleTask.flatMap { it.outputFile }
        def pomFile = pomTask.map { it.destination }
        inputs.file(moduleFile)
        inputs.file(pomFile)
        def projectPath = path
        doLast {
            def module = new groovy.json.JsonSlurper().parse(moduleFile.get().asFile)
            def platforms = module.variants.collectMany { variant ->
                (variant.dependencies ?: []).findAll { dependency ->
                    def category = dependency.attributes?.get('org.gradle.category')
                    category == 'platform' || category == 'enforced-platform'
                }.collect { dependency -> "${dependency.group}:${dependency.module} (${variant.name})" }
            }
            if (!platforms.isEmpty()) {
                throw new GradleException(
                        "${projectPath}: опубликованные метаданные экспортируют платформу: ${platforms.join(', ')}. "
                                + 'См. docs/adr/0106-starter-does-not-export-bom.md.')
            }
            if (pomFile.get().text.contains('<dependencyManagement>')) {
                throw new GradleException(
                        "${projectPath}: опубликованный POM содержит dependencyManagement. "
                                + 'См. docs/adr/0106-starter-does-not-export-bom.md.')
            }
        }
    }

    tasks.named('check') {
        dependsOn verifyNoExportedPlatform
    }
}
