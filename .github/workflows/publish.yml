# Публикация по тегу v<версия> в GitHub Packages (docs/adr/0146-publishing-to-github-packages.md)
# и Maven Central (docs/adr/0147-publishing-to-maven-central.md).
# Публикуется только то, что прошло полную сборку. Секреты репозитория: SIGNING_KEY, SIGNING_PASSWORD,
# CENTRAL_USERNAME, CENTRAL_PASSWORD; для GitHub Packages хватает встроенного GITHUB_TOKEN.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Тег обязан совпадать с версией в build.gradle: иначе под тегом v2.0.1 уехал бы 2.0.0.
      - name: Сверить тег с версией
        run: |
          version=$(sed -n "s/^ *version = '\(.*\)'/\1/p" build.gradle | head -n 1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией ${version} в build.gradle" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build

      # Подписанные артефакты — в GitHub Packages и в архив для Central (docs/adr/0147-publishing-to-maven-central.md).
      - run: ./gradlew publishAllPublicationsToGitHubPackagesRepository centralBundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      # Загрузка в Central Portal с автоматическим выпуском и ожидание, пока портал проверит архив.
      # Выпущенную версию в Central не удалить и не заменить, поэтому шаг идёт последним.
      - name: Выпустить в Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          auth="Authorization: Bearer $(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          api=https://central.sonatype.com/api/v1/publisher
          id=$(curl --fail-with-body -sS -X POST -H "$auth" \
            -F bundle=@build/central/central-bundle.zip \
            "$api/upload?name=taskcomm-${GITHUB_REF_NAME}&publishingType=AUTOMATIC")
          echo "Развёртывание $id"
          for i in $(seq 1 60); do
            status=$(curl --fail-with-body -sS -X POST -H "$auth" "$api/status?id=$id")
            state=$(echo "$status" | jq -r .deploymentState)
            echo "Состояние: $state"
            case "$state" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "$status" | jq . >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "Портал не закончил проверку за 30 минут" >&2
          exit 1
